[package]
name = "kojutsu"
version = "0.1.0"
authors = ["Kieran Siek <git@siek.dev>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# ANSI escape codes → ratatui styled text
ansi-to-tui = "8.0"
# Bitflags for command flag toggles
bitflags = "2"
# Argument parser
clap = { version = "4.5", features = ["derive"] }
# Date/time (for jj-lib's DatePatternContext)
chrono = "0.4"
# Binary error handling
color-eyre = "0.6.3"
# Terminal input backend
crossterm = "0.29"
# Memory efficient string types
compact_str = "0.9.0"
# Stack-allocated small vectors (avoids heap for 1-2 element Vecs)
smallvec = "1"
# StreamExt for jj-lib's async diff streams (used with pollster::block_on)
futures = "0.3"
# Date/time
jiff = "0.2"
# Jujutsu version control library
jj-lib = { version = "0.41", features = ["git"] }
# Lua scripting
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
# Clipboard access (for Lua `kojutsu.copy()`)
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
# Key string parser (e.g. "ctrl-a", "shift-j", "a b")
keymap_parser = "1.0.0-rc.4"
# I/O event polling (wake terminal reader without busy-polling)
mio = { version = "1", features = ["os-poll"] }
# Block on async futures
pollster = "0.4"
# DAG graph rendering (same library jj uses)
sapling-renderdag = "0.1"
# killpg for cancelling background jj commands
nix = { version = "0.29", features = ["signal"] }
# Safe signal handling (ignore SIGINT while child processes run)
signal-hook = "0.4"
# mio adapter for signal-hook
signal-hook-mio = { version = "0.3", features = ["support-v1_0"] }
# Serialization (required by keymap_parser, future config files)
serde = { version = "1", features = ["derive"] }
# Syntax highlighting for file annotate view
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "default-themes",
  "regex-onig",
] }
two-face = { version = "0.4", default-features = false, features = [
  "syntect-onig",
] }
fuzzy-matcher = "0.3"
# Shell argument quoting for display strings
shlex = "1.3"
# Enum utilities
strum = { version = "0.28.0", features = ["derive"] }
# Terminal UI
ratatui = "0.30"
# JSON serialization (for diff tool selection files)
serde_json = "1"
# Temporary files (for $EDITOR workflows)
tempfile = "3"
# Library error types
thiserror = "2.0.11"
# Single-line text input widget for ratatui
tui-input = "0.15"
# Unicode display width calculation (for horizontal scroll trimming)
unicode-width = "0.2"
# Logging utilities
time = { version = "0.3.37", features = ["formatting"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "time"] }
# Recursive directory walking (for diff tool)
walkdir = "2"
# Iterator utilities
itertools = "0.14.0"
# Config file parsing
toml = "1.1.2"
dirs = "6.0.0"
vec1 = { version = "1.12.1", features = ["smallvec-v1"] }

[build-dependencies]
toml = "1.1.2"

# Build `backtrace` with optimizations for `color-eyre` performance
[profile.dev.package.backtrace]
opt-level = 3

[profile.production]
inherits = "release"
# Enable link time optimization
lto = true
# Strip symbols
strip = true
