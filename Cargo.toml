[package]
name = "jujujutsu"
version = "0.1.0"
authors = ["Kieran Siek <git@siek.dev>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Argument parser
clap = { version = "4.5", features = ["derive"] }
# Date/time (for jj-lib's DatePatternContext)
chrono = "0.4"
# Binary error handling
color-eyre = "0.6.3"
# Date/time
jiff = "0.2"
# Jujutsu version control library
jj-lib = { version = "0.39", features = ["git"] }
# Block on async futures
pollster = "0.4"
# DAG graph rendering (same library jj uses)
sapling-renderdag = "0.1"
# Terminal UI
ratatui = "0.30"
# Library error types
thiserror = "2.0.11"
# Logging utilities
time = { version = "0.3.37", features = ["formatting"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "time"] }

# Build `backtrace` with optimizations for `color-eyre` performance
[profile.dev.package.backtrace]
opt-level = 3

[profile.production]
inherits = "release"
# Enable link time optimization
lto = true
# Strip symbols
strip = true
