# Kojutsu configuration
# Place this file at ~/.config/kojutsu/config.toml

# Color theme: all fields are optional, shown values are the defaults.
# Colors can be: named ("cyan"), hex ("#619eef"), RGB ({ r = 50, g = 50, b = 60 }),
# or ANSI index (42).
[theme]
accent = "cyan"                           # prompts, headers, visual range, immutable glyphs
selection = "yellow"                      # selected items, active toggles, keys, author
muted = "dark_gray"                       # borders, labels, disabled items, context lines
text = "white"                            # normal text, descriptions, file paths
error = "red"                             # errors, conflicts, removed/deleted lines
warning = "yellow"                        # committed without description, other warnings
added = "green"                           # added lines, working copy, workspace names
change_id = "magenta"                     # change IDs, diff headers, bookmarks
commit_id = "blue"                        # commit IDs
selection_bg = { r = 50, g = 50, b = 60 } # background highlight for cursor row

# Timestamp format (strftime syntax).
# date_format = "%Y-%m-%d %H:%M:%S"

# Glyph characters for commit nodes in the DAG graph.
# [glyphs]
# working_copy = "@"
# conflict     = "×"
# immutable    = "◆"
# merge        = "⊕"
# normal       = "○"

# Search scopes enabled by default when starting a new search.
# [default_search_scopes]
# change_id   = true
# commit_id   = false
# description = true
# bookmark    = false
# author      = false
# path        = false
# line        = false
# tag         = false

# Named revset presets: keys 1-5 switch between the first 5 presets.
# [[revsets.presets]]
# name = "default"
# revset = "present(@) | ancestors(immutable_heads()..@, 2) | ancestors(trunk(), 16)"
#
# [[revsets.presets]]
# name = "all mine"
# revset = "author(exact:'me@example.com')"
#
# [[revsets.presets]]
# name = "recent"
# revset = "heads(all())"

# Running commands over revisions with `jj run` (the `!` prefix in the
# DAG view). Presets are offered in the run picker; commands run without
# a shell in a private working copy per revision.
# [run]
# presets = ["cargo check", "cargo clippy", "cargo fix --allow-dirty"]

# Diff computation.
# [diff]
# Max file size in MiB (per side) loaded into memory when computing a diff.
# Larger files show a placeholder instead of a diff — a memory guard for
# repos with huge text files.
# max_file_size_mib = 64
